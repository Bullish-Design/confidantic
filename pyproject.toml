[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confidantic"
version = "1.0.0a1"
description = "Deterministic configuration management for devman-managed projects."
readme = "README.md"
authors = [{name = "Bullish-Design", email = "BullishDesignEngineering@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.3",
    "rich>=13.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-tmp-files>=0.0.2",
]

[project.urls]
Repository = "https://github.com/Bullish-Design/confidantic"

[tool.hatch.build.targets.wheel]
packages = ["src/confidantic"]

[project.scripts]
confidantic = "confidantic.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
